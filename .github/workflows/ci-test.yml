name: CI Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  android-integration:
    uses: ./.github/workflows/android-integration.yml

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Check Android compatibility declarations
        run: python3 tools/check_android_compatibility.py

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check project and release contracts
        run: |
          python3 tools/check_project_contracts.py
          python3 -m unittest discover -s tools -p '*_test.py'
          python3 tools/release_notes_test.py

      - name: Install content validator dependencies
        working-directory: tools/poem_importer
        run: dart pub get

      - name: Validate bundled content
        run: dart run tools/poem_importer/bin/poem_importer.dart validate

      - name: Run analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test
