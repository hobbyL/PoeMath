name: Android integration journeys

on:
  workflow_call:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    # Bound each expensive phase separately and leave time to upload diagnostics.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check native PDFium security inputs
        run: python3 tools/check_pdfium_security.py
      - name: Warm Android integration build before starting emulator
        timeout-minutes: 12
        # Warm native/plugin tasks; flutter test still generates its own Dart entry.
        # Match its ABI/defines and finish NDK/CMake downloads before boot.
        run: >-
          flutter build apk --debug --no-pub
          --target integration_test/app_journeys_test.dart
          --target-platform android-x64
          --dart-define=POEMATH_INTEGRATION_TEST=true
          --dart-define=INTEGRATION_TEST_SHOULD_REPORT_RESULTS_TO_NATIVE=false
      - name: Stop build daemon before starting emulator
        timeout-minutes: 1
        working-directory: android
        run: ./gradlew --stop
      - name: Check disk space before Android emulator setup
        run: |
          set -euo pipefail
          poemath_avd_home="${ANDROID_AVD_HOME:-$HOME/.android/avd}"
          mkdir -p "$poemath_avd_home"
          df -h "$poemath_avd_home"
          poemath_available_kb=$(df -Pk "$poemath_avd_home" | awk 'NR == 2 {print $4}')
          # Reserve 2 GiB for test data and 3 GiB for SDK/build headroom.
          if [ "$poemath_available_kb" -lt 5242880 ]; then
            echo "::error::Android emulator setup needs at least 5 GiB free; available: ${poemath_available_kb} KiB."
            exit 1
          fi
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run journeys on minimum supported Android version
        # SDK setup + 5-minute boot + 10-minute test + bounded diagnostic collection.
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 24
          arch: x86_64
          target: google_apis
          emulator-boot-timeout: 300
          # The hosted runner had 6106 MB free; the default userdata needed 7373 MB.
          # Keep disposable test data bounded independently of emulator defaults.
          disk-size: 2048M
          pre-emulator-launch-script: df -h "$ANDROID_AVD_HOME"
          disable-animations: true
          script: bash tools/run_android_integration.sh
      - name: Archive Android integration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-integration-diagnostics
          path: build/test-results/android-integration/
          if-no-files-found: ignore
          retention-days: 7
